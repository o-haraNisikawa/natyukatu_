<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログアウト | 画面タイトル</title>
  <link rel="stylesheet" href="logout.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 90 64" role="img" aria-label="共通ロゴ">
        <defs>
          <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient>
          <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient>

        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#blue)"/>

        <path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>

      <div class="brand-title">画面タイトル</div>
    </div>
    <div class="spacer"></div>
    <a class="login-link" href="login.html">ログイン</a>
  </header>

  <div class="layout">
    <aside class="empty-rail" aria-hidden="true"></aside>
    <main>
      <section class="complete-card" aria-labelledby="pageTitle">
        <h1 id="pageTitle">ログアウト</h1>
        <p class="message">ログアウトしました</p>
        <a class="primary-link" href="login.html">ログイン画面へ</a>
      </section>
    </main>
  </div>

</html>
