<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログアウト確認 | 画面タイトル</title>
  <link rel="stylesheet" href="logout-confirm.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 90 64" role="img" aria-label="共通ロゴ">
        <defs>
          <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient>
          <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient>
        </defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#blue)"/>
        <path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#teal)" opacity=".96"/>
        <path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <div class="brand-title">画面タイトル</div>
    </div>
    <div class="spacer"></div>
    <div class="account">
      <span class="user-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg></span>
      <span class="account-name">ログインユーザー名 <span aria-hidden="true">⌄</span></span>
    </div>
    <button class="header-logout" type="button" data-open-dialog>ログアウト</button>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="サイドバー">
      <div class="rank">称号</div>
      <a class="nav active" href="#top"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>トップ画面</a>
      <a class="nav" href="#contact"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="m3 6 9 7 9-7"/></svg>お問い合わせ</a>
      <a class="nav" href="#ranking"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M5 20h14l1-11-5 4-3-8-3 8-5-4z"/><path d="M4 22h16"/></svg>ランキング</a>
      <div class="divider"></div>
      <a class="nav" href="#logout" data-open-dialog><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>ログアウト</a>
    </aside>
    <main id="top">
      <h1>トップ画面</h1>
      <div class="placeholder"></div>
      <div class="placeholder"></div>
    </main>
  </div>

  <div class="shade" id="logoutDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog">
      <h2 id="dialogTitle">ログアウトしますか？</h2>
      <div class="actions">
        <button class="cancel" id="cancelLogout" type="button">キャンセル</button>
        <button class="confirm" id="confirmLogout" type="button">ログアウト</button>
      </div>
    </div>
  </div>

  <script>
    const dialog = document.getElementById('logoutDialog');
    document.querySelectorAll('[data-open-dialog]').forEach(button => {
      button.addEventListener('click', event => {
        event.preventDefault();
        dialog.style.display = 'grid';
      });
    });
    document.getElementById('cancelLogout').addEventListener('click', () => {
      location.href = 'top.html';
    });
    document.getElementById('confirmLogout').addEventListener('click', () => {
      location.href = 'logout.html';
    });
  </script>
</body>
</html>
