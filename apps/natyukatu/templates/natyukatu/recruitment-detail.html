<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>募集詳細 | 画面タイトル</title>
  <link rel="stylesheet" href="recruitment-detail.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs>
          <linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient>
          <linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient>
        </defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/>
        <path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/>
        <path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="topbar-spacer"></div>
    <div class="account">
      <span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span>
      <span class="account-name">ログインユーザー名</span><span class="chevron" aria-hidden="true"></span>
    </div>
    <a class="logout-link" href="logout-confirm.html">ログアウト</a>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="sidebar-caption">称号</div>
      <nav>
        <a class="nav-link active" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="nav-divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>

    <main class="main-content">
      <section class="detail-card" aria-labelledby="page-title">
        <h1 id="page-title">募集詳細</h1>
        <div class="detail-grid">
          <div class="visual-column">
            <div class="main-image" role="img" aria-label="募集画像">
              <svg viewBox="0 0 220 180" aria-hidden="true"><circle cx="157" cy="46" r="20"/><path d="m28 143 44-57a7 7 0 0 1 11 0l34 43 22-29a7 7 0 0 1 11 0l42 43a7 7 0 0 1-5 12H34a7 7 0 0 1-6-12Z"/></svg>
            </div>
            <h2 class="tags-title">関連タグ</h2>
            <div class="tag-list">
              <span class="tag"><svg viewBox="0 0 24 24"><path d="M3 11V4h7l10 10-6 6Z"/><circle cx="7.5" cy="7.5" r="1"/></svg><i></i></span>
              <span class="tag"><svg viewBox="0 0 24 24"><path d="M3 11V4h7l10 10-6 6Z"/><circle cx="7.5" cy="7.5" r="1"/></svg><i></i></span>
              <span class="tag"><svg viewBox="0 0 24 24"><path d="M3 11V4h7l10 10-6 6Z"/><circle cx="7.5" cy="7.5" r="1"/></svg><i></i></span>
            </div>
          </div>

          <div class="info-column">
            <div class="title-row">
              <div class="field-title"><h2>募集名</h2><div class="placeholder title-placeholder"></div></div>
              <button class="favorite-button" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg><span>お気に入り</span></button>
            </div>

            <div class="info-row content-row"><svg class="row-icon" viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg><h3>内容</h3><div class="placeholder-lines"><i></i><i></i><i></i></div></div>
            <div class="info-row"><svg class="row-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg><h3>日時</h3><div class="placeholder short-wide"></div></div>
            <div class="info-row"><svg class="row-icon" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><h3>場所</h3><div class="placeholder short-wide"></div></div>
            <div class="info-row"><svg class="row-icon" viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8-7.5a4 4 0 0 1 0 7.5M21 20v-1.5a4 4 0 0 0-3-3.9"/></svg><h3>募集人数</h3><div class="placeholder number-placeholder"></div></div>
            <div class="info-row bring-row"><svg class="row-icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg><h3>持ち物</h3><div class="placeholder-lines"><i></i><i></i></div></div>
            <div class="info-row organizer-row"><svg class="row-icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></svg><h3>募集者情報</h3><div class="organizer-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></div><div class="placeholder-lines"><i></i><i></i></div></div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><strong>閲覧数</strong><span class="placeholder stat-value"></span></div>
          <div class="stat"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg><strong>お気に入り数</strong><span class="placeholder stat-value"></span></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const favoriteButton = document.querySelector('.favorite-button');
    favoriteButton.addEventListener('click', () => {
      const isFavorite = favoriteButton.getAttribute('aria-pressed') === 'true';
      favoriteButton.setAttribute('aria-pressed', String(!isFavorite));
      favoriteButton.querySelector('span').textContent = isFavorite ? 'お気に入り' : 'お気に入り済み';
    });
  </script>
</body>
</html>
