<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーザー情報変更 | 画面タイトル</title>
  <link rel="stylesheet" href="user-information-change.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="side-caption">称号</div>
      <nav class="nav">
        <a class="nav-link active" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>

    <main>
      <h1 class="page-title">ユーザー情報変更</h1>
      <form class="form-card" id="userInfoForm">
        <div class="form-row"><label class="label" for="userId">ユーザーID</label><div class="input-wrap"><input class="input" id="userId" name="userId" value="" placeholder="登録済みのユーザーID" readonly><span class="note">ユーザーIDは変更できません</span></div></div>
        <div class="form-row"><label class="label" for="email">メールアドレス</label><div class="input-wrap"><input class="input" id="email" name="email" type="email" placeholder="メールアドレスを入力してください" autocomplete="email"></div></div>
        <div class="form-row"><label class="label" for="password">パスワード</label><div class="input-wrap password-wrap"><input class="input" id="password" name="password" type="password" placeholder="変更する場合に入力してください" autocomplete="new-password"><button class="toggle-password" type="button" id="togglePassword" aria-label="パスワードを表示">◉</button></div></div>
        <div class="form-row"><label class="label" for="occupation">職業</label><div class="input-wrap"><input class="input" id="occupation" name="occupation" placeholder="職業を入力してください"></div></div>
        <div class="form-row"><label class="label" for="age">年齢</label><div class="input-wrap"><input class="input" id="age" name="age" type="number" min="0" max="120" placeholder="年齢を入力してください"></div></div>
        <div class="form-row"><label class="label" for="gender">性別</label><div class="input-wrap"><input class="input" id="gender" name="gender" placeholder="性別を入力してください"></div></div>
        <div class="form-row"><label class="label" for="phone">電話番号</label><div class="input-wrap"><input class="input" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="電話番号を入力してください"></div></div>
        <div class="actions"><button class="save-button" type="submit">保存</button></div>
        <p class="message" id="saveMessage" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>
  <script>
    const passwordInput = document.getElementById('password');
    document.getElementById('togglePassword').addEventListener('click', function () {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      this.setAttribute('aria-label', show ? 'パスワードを隠す' : 'パスワードを表示');
    });
    document.getElementById('userInfoForm').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('saveMessage').textContent = '入力内容を保存しました（画面イメージ）';
    });
  </script>
</body>
</html>
