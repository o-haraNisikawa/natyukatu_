<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>募集情報変更 | 画面タイトル</title>
  <link rel="stylesheet" href="recruitment-change.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="user-badge"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>称号</span></div>
      <nav class="nav">
        <a class="nav-link" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
        <a class="nav-link active" href="recruitment-register.html"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg><span>新規募集登録</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>
    <main>
      <section class="form-card" aria-labelledby="pageTitle">
        <h1 class="page-title" id="pageTitle">募集情報変更</h1>
        <form id="recruitmentChangeForm">
          <div class="top-fields">
            <div class="field"><label class="field-label" for="recruitmentName">募集名 <span class="required">必須</span></label><input class="control" id="recruitmentName" name="recruitmentName" required placeholder="登録済み募集名"></div>
            <div class="field"><label class="field-label" for="description">内容（手順説明など） <span class="required">必須</span></label><textarea class="control textarea" id="description" name="description" required placeholder="登録済み募集内容"></textarea></div>
            <div class="field">
              <label class="field-label" for="media">画像or動画 <span class="required">必須</span></label>
              <label class="upload-box" id="uploadBox" for="media"><svg class="upload-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 45H14a11 11 0 0 1 0-22 17 17 0 0 1 33-3 13 13 0 0 1 3 25h-4M32 54V31m-9 9 9-9 9 9"/></svg><span class="upload-text">ここにファイルをドラッグ＆ドロップ<br>または<br><strong>ファイルを選択</strong><br><span>※画像・動画ファイルをアップロードできます。</span><span class="file-name" id="fileName">登録済み画像・動画を変更する場合に選択</span></span></label>
              <input class="file-input" id="media" name="media" type="file" accept="image/*,video/*">
            </div>
          </div>
          <div class="lower-grid">
            <div class="lower-column">
              <div class="field"><label class="field-label" for="eventDate">日時 <span class="required">必須</span></label><input class="control" id="eventDate" name="eventDate" type="datetime-local" required></div>
              <div class="field"><label class="field-label" for="location">場所 <span class="required">必須</span></label><input class="control" id="location" name="location" required placeholder="登録済み情報"></div>
              <div class="field"><label class="field-label" for="capacity">定員 <span class="required">必須</span></label><input class="control" id="capacity" name="capacity" type="number" min="1" required placeholder="登録済み情報"></div>
            </div>
            <div class="lower-column">
              <div class="field"><label class="field-label" for="targetAudience">対象者 <span class="required">必須</span></label><input class="control" id="targetAudience" name="targetAudience" required placeholder="登録済み情報"></div>
              <div class="field"><label class="field-label" for="items">持ち物 <span class="required">必須</span></label><input class="control" id="items" name="items" required placeholder="登録済み情報"></div>
              <div class="field"><label class="field-label" for="contact">連絡事項 <span class="required">必須</span></label><textarea class="control" id="contact" name="contact" required placeholder="登録済み情報"></textarea></div>
            </div>
          </div>
          <div class="save-wrap"><button class="save-button" type="submit">変更を保存</button><p class="message" id="message" role="status" aria-live="polite"></p></div>
        </form>
      </section>
    </main>
  </div>
  <script>
    const mediaInput = document.getElementById('media');
    const uploadBox = document.getElementById('uploadBox');
    mediaInput.addEventListener('change', () => {
      document.getElementById('fileName').textContent = mediaInput.files.length ? Array.from(mediaInput.files).map(file => file.name).join('、') : '登録済み画像・動画を変更する場合に選択';
    });
    ['dragenter','dragover'].forEach(type => uploadBox.addEventListener(type, event => { event.preventDefault(); uploadBox.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(type => uploadBox.addEventListener(type, event => { event.preventDefault(); uploadBox.classList.remove('dragover'); }));
    uploadBox.addEventListener('drop', event => {
      if (event.dataTransfer.files.length) {
        mediaInput.files = event.dataTransfer.files;
        mediaInput.dispatchEvent(new Event('change'));
      }
    });
    document.getElementById('recruitmentChangeForm').addEventListener('submit', event => {
      event.preventDefault();
      document.getElementById('message').textContent = '変更内容を保存しました（画面見本）';
    });
  </script>
</body>
</html>
