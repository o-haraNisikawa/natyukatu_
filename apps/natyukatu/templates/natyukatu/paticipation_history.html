<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参加履歴 | 画面タイトル</title>
  <link rel="stylesheet" href="participation-history.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="side-caption">称号</div>
      <nav class="nav">
        <a class="nav-link active" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>
    <main>
      <h1 class="page-title">参加履歴</h1>
      <section class="history-card" aria-label="参加履歴一覧">
        <div class="table-wrap">
          <table>
            <thead><tr><th scope="col">開催日時</th><th scope="col">募集名</th><th scope="col">詳細</th><th scope="col">状態</th><th scope="col">状態変更</th></tr></thead>
            <tbody>
              <tr><td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る</a></td><td class="status">申し込み済</td><td>－</td></tr>
              <tr><td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る</a></td><td class="status">参加中</td><td><select class="status-select" aria-label="参加中の状態を変更"><option value="">選択してください</option><option value="withdrawn">辞退</option><option value="completed">完了</option></select></td></tr>
              <tr><td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る</a></td><td class="status">辞退</td><td>－</td></tr>
              <tr><td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る</a></td><td class="status">完了</td><td>－</td></tr>
            </tbody>
          </table>
        </div>
        <div class="actions"><button class="update-button" type="button" id="updateButton">更新</button><p class="hint">状態変更は参加中の場合のみ表示</p></div>
        <p class="result" id="result" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script>
    document.getElementById('updateButton').addEventListener('click', () => {
      const select = document.querySelector('.status-select');
      const result = document.getElementById('result');
      if (!select.value) {
        result.textContent = '状態を選択してください。';
        return;
      }
      const row = select.closest('tr');
      row.querySelector('.status').textContent = select.value === 'withdrawn' ? '辞退' : '完了';
      row.cells[4].textContent = '－';
      result.textContent = '参加状態を更新しました（画面見本）';
    });
  </script>
</body>
</html>
