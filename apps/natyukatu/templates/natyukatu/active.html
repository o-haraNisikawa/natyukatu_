<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活動用画面 | 画面タイトル</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="user-badge"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>称号</span></div>
      <nav class="nav">
        <a class="nav-link" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link active" href="activity.html"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.5a2.5 2.5 0 0 1-1-2Z"/></svg><span>活動用画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>
    <main>
      <h1 class="page-title">活動用画面</h1>
      <div class="activity-grid">
        <section class="panel message-panel" aria-labelledby="messagesTitle">
          <header class="panel-header"><h2 class="panel-title" id="messagesTitle">メッセージ</h2><select class="item-select" aria-label="表示項目"><option value="">項目を選択</option><option>メッセージ表示</option><option>参加者一覧表示</option></select></header>
          <div class="messages" id="messages" aria-live="polite">
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble"><i class="line long"></i><i class="line medium"></i></div></div>
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble alt"><i class="line long"></i><i class="line medium"></i></div></div>
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble"><i class="line long"></i><i class="line short"></i></div></div>
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble alt"><i class="line long"></i><i class="line medium"></i></div></div>
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble"><i class="line long"></i><i class="line short"></i></div></div>
          </div>
          <form class="compose" id="messageForm"><input class="compose-input" id="messageInput" placeholder="メッセージを入力" aria-label="メッセージを入力"><button class="send-button" type="submit">送信</button></form>
          <p class="notice" id="notice" role="status"></p>
        </section>
        <aside class="panel participant-panel" aria-labelledby="participantsTitle">
          <header class="participant-header"><h2 class="participant-title" id="participantsTitle">参加者一覧</h2></header>
          <div class="participant-list">
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <script>
    document.getElementById('messageForm').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      const notice = document.getElementById('notice');
      if (!text) {
        notice.textContent = 'メッセージを入力してください。';
        input.focus();
        return;
      }
      const row = document.createElement('div');
      row.className = 'message-row';
      const avatar = document.createElement('span');
      avatar.className = 'message-avatar';
      avatar.setAttribute('aria-hidden','true');
      avatar.innerHTML = '<svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg>';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      bubble.style.lineHeight = '1.5';
      row.append(avatar,bubble);
      document.getElementById('messages').appendChild(row);
      input.value = '';
      notice.textContent = 'メッセージを画面に追加しました（画面見本）';
      row.scrollIntoView({block:'nearest'});
    });
  </script>
</body>
</html>
